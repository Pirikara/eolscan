name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scripts/design-requirements.txt
      - name: Check Go formatting
        run: test -z "$(gofmt -l cmd internal schemas tests)"
      - name: Vet
        run: make vet
      - name: Test with race detection and coverage
        run: go test -race -coverpkg=./internal/... -coverprofile=coverage.out ./...
      - name: Show statement coverage
        run: go tool cover -func=coverage.out
      - name: Build CLI
        run: make build
      - name: Install contract validation dependencies
        run: python -m pip install -r scripts/design-requirements.txt
      - name: Validate schemas and fixtures
        run: python scripts/validate_design.py
